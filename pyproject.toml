[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "cengine"
version = "0.1.0"
description = "Paper-first native trading engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["h5py>=3.10", "numpy>=1.26", "websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]
metal = ["pyobjc-framework-Metal>=10.3; platform_system == 'Darwin'"]
research = ["cvxpy>=1.5", "scikit-learn>=1.5"]

[tool.scikit-build]
cmake.version = ">=3.24"
wheel.packages = ["cengine", "market_data"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
