[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "cengine"
version = "0.1.0"
description = "Paper-first native trading engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["h5py>=3.10", "numpy>=1.26", "websockets>=12",
                "pyarrow>=16", "duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]
metal = ["pyobjc-framework-Metal>=10.3; platform_system == 'Darwin'"]
research = ["cvxpy>=1.5", "scikit-learn>=1.5"]
nosql = ["pymongo>=4.8"]
# Adaptive ML/RL learning layer (Milestone 6). GPU-first on Apple silicon via MLX
# (local Metal backend — no CUDA, no cloud, no paid service); scikit-learn/numpy are
# the independent CPU baselines + fallback. MLX is platform-guarded so non-arm64/non-
# Darwin installs degrade to CPU-only baselines without a hard failure.
learning = ["scikit-learn>=1.5", "pandas>=2.0", "scipy>=1.11", "joblib>=1.3",
            "mlx>=0.20; platform_system == 'Darwin' and platform_machine == 'arm64'"]
# Market scanner (migrated market_scan/ package) runtime dependencies. Needed
# only when the in-process IEX scanner actually connects; the scanner's core
# ranking/discovery/publication logic imports without them.
scan = ["alpaca-py>=0.33", "pandas>=2.0", "requests>=2.31", "lxml>=5.0"]

[tool.scikit-build]
cmake.version = ">=3.24"
wheel.packages = ["cengine", "market_data"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: heavy end-to-end checks (e.g. full lakehouse certification passes)",
]
# Keep the repo root on sys.path for tests regardless of invocation (`pytest` vs
# `python -m pytest`), so top-level modules import live from the repo and never fall
# back to a stale installed copy.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
# `iex/` is a vendored THIRD-PARTY nested git repository (its own .git + history),
# not part of C-Engine's own source. It is excluded from project linting as vendored
# code — this is not a suppression of C-Engine's own lint (all first-party code is clean).
extend-exclude = ["iex"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[[tool.mypy.overrides]]
module = ["_cengine_native", "sklearn.*"]
ignore_missing_imports = true
